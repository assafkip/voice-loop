[project]
name = "voice-loop"
version = "0.2.0"
description = "Make AI write in your voice without fine-tuning: a local-first style fingerprint, deterministic output gates, and a corrections loop that learns from rejected drafts."
keywords = ["ai-writing", "voice-cloning", "style-transfer", "claude", "chatgpt",
            "prompt-engineering", "writing-style", "llm-tools", "personalization",
            "no-fine-tuning", "writing-assistant", "authorship-verification"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Office/Business :: Writing",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]
requires-python = ">=3.9"
dependencies = []
license = {text = "MIT"}

[project.urls]
Homepage = "https://github.com/assafkip/voice-loop"
Issues = "https://github.com/assafkip/voice-loop/issues"

[project.scripts]
voiceloop = "voiceloop.cli:main"

# EXPLICIT, because this repo is a flat layout with three top-level directories
# (voiceloop/, corpus/, authorship/). Setuptools auto-discovery refuses to guess
# between them and aborts the build, which made `pip install -e .` -- the second
# line of the README's own quickstart -- fail on every clean clone. Only the
# package ships; corpus/ is your data and authorship/ is an optional extra.
[tool.setuptools]
packages = ["voiceloop"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
